<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Internova – Discover Opportunities. Start Your Journey.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--co:#F97316;--bl:#1D4ED8;--pe:#FFEDD5;--lb:#DBEAFE;--ww:#FFFBF7;--nv:#172033;--ok:#10B981;--wa:#F59E0B;--er:#EF4444;--mu:#4B5563;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box;margin:0}
body{font:16px/1.55 Inter,system-ui,sans-serif;background:var(--ww);color:var(--nv);overflow-x:hidden}
h1,h2,h3,button,.btn{font-family:Poppins,Inter,sans-serif}h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.12}h2{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:10px}h3{font-size:1.02rem}a{color:var(--bl)}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}.wrap{max-width:1180px;margin:auto;padding:0 20px}section{padding:44px 0}.sr{position:absolute;left:-9999px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fffffff5;border-bottom:1px solid #eadfd3}.nb{display:flex;align-items:center;gap:12px;min-height:68px}.nb>a img{height:46px;display:block}
#nv{display:flex;gap:2px;margin:0 auto}#nv a,.ib{padding:9px 13px;border-radius:99px;color:var(--nv);text-decoration:none;font:500 15px Inter;cursor:pointer;background:none;border:0;min-height:40px}#nv a:hover,#nv a.on{background:var(--pe)}#nv a.on{font-weight:600;box-shadow:inset 0 -3px var(--co)}
.ra{display:flex;gap:6px;align-items:center}.bg{display:none}
.btn{background:var(--co);color:var(--nv);border:0;border-radius:99px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;transition:.2s;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #f973164d}.btn.b{background:var(--bl);color:#fff}.btn.o{background:#fff;border:2px solid var(--bl);color:var(--bl)}.btn.s{padding:7px 16px;min-height:40px}.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:#fff;border:1px solid #efe4d8;border-radius:20px;padding:20px;box-shadow:0 4px 18px #17203310;transition:.25s}.op{cursor:pointer;animation:fu .35s both}.op:hover{transform:translateY(-4px);box-shadow:0 12px 28px #17203322}@keyframes fu{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;margin-top:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-top:44px}.kick{display:inline-block;background:var(--pe);color:#9A3412;font:600 13px Poppins;letter-spacing:.06em;padding:6px 14px;border-radius:99px;margin-bottom:14px}.co{color:var(--co)}.lead{font-size:1.1rem;color:#374151;margin:16px 0 24px;max-width:540px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hv{background:linear-gradient(135deg,var(--pe),var(--lb));border-radius:32px;aspect-ratio:1/.85;overflow:hidden}.hv svg{width:100%;height:100%}
.fb{display:grid;gap:14px}input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid #cfc6bc;border-radius:12px;font:inherit;background:#fff;color:var(--nv);min-height:44px}label{display:grid;gap:4px;font-weight:500;font-size:14px}.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1.5px solid #cbd5e1;background:#fff;border-radius:99px;padding:8px 16px;font:500 14px Inter;cursor:pointer;color:var(--nv);min-height:40px;transition:.2s}.chip:hover{border-color:var(--bl)}.chip.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tg span{background:var(--lb);border-radius:99px;padding:3px 10px;font-size:13px}.mt{color:var(--mu);font-size:14px;margin-top:6px}
.ct{display:flex;gap:12px;align-items:center}.lg{width:44px;height:44px;border-radius:12px;background:var(--pe);display:grid;place-items:center;font:700 18px Poppins;color:#C2410C;flex:none}.ac{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.sv{background:#fff;border:1.5px solid #cbd5e1;border-radius:99px;padding:8px 14px;cursor:pointer;color:var(--nv);min-height:40px;font:500 14px Inter}.sv.on{background:var(--pe);border-color:var(--co)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.cv{height:120px;border-radius:14px;margin-bottom:12px;display:grid;place-items:center;color:#fff;font:700 34px Poppins;position:relative;overflow:hidden}.cv:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;border:14px solid #ffffff44}
.hw{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.hw .card{text-align:center}.hw b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--lb);color:var(--bl);margin:0 auto 10px;font:700 18px Poppins}
.bd{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c);background:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600}.bd i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tl{position:relative;display:flex;margin:16px 0 6px}.tl:before{content:"";position:absolute;top:15px;left:10%;right:10%;height:4px;background:#e5e7eb}.tl u{position:absolute;top:15px;left:10%;height:4px;background:var(--co);animation:gw .9s .2s both}@keyframes gw{from{width:0}to{width:var(--w)}}
.st{flex:1;text-align:center;position:relative;z-index:1}.st span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e5e7eb;margin:0 auto 4px;font-weight:600;font-size:14px}.st small{font-size:12px;color:var(--mu)}.st.dn span{background:var(--co);animation:fu .4s var(--d) both}.st.rj span{background:var(--er);color:#fff}.rjt{color:#B91C1C;font-weight:600}
.pb{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--co),var(--bl));border-radius:99px;transition:width 1.2s}
.pg{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:20px;align-items:start}.stack{display:grid;gap:20px}.av{width:72px;height:72px;border-radius:50%;background:var(--bl);color:#fff;display:grid;place-items:center;font:600 28px Poppins;margin-bottom:10px}
.auth{max-width:440px;margin:30px auto}.auth form,.modal form{display:grid;gap:12px}
.modal{position:fixed;inset:0;background:#172033aa;display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:.25s;z-index:50}.modal.on{opacity:1;visibility:visible}
#mbw{background:#fff;border-radius:24px;padding:28px;max-width:640px;width:100%;max-height:90vh;overflow:auto;position:relative;transform:translateY(16px);transition:.25s}.modal.on #mbw{transform:none}#mb{display:grid;gap:12px}.x{position:absolute;top:10px;right:12px;border:0;background:var(--pe);border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:16px;color:var(--nv)}
.okc{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px}dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}dt{color:var(--mu)}dd{font-weight:600}ul{padding-left:20px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--nv);color:#fff;padding:12px 20px;border-radius:12px;transition:.3s;z-index:60;max-width:90vw}#toast.on{transform:translate(-50%,0)}
.cta{background:linear-gradient(135deg,var(--bl),#1E3A8A);color:#fff;border-radius:28px;padding:44px 24px;text-align:center}.cta .btn{margin-top:14px}footer{padding:28px 0;color:var(--mu);font-size:14px;border-top:1px solid #eadfd3;text-align:center}
.op{overflow:hidden}.im{margin:-20px -20px 14px;height:150px;overflow:hidden;background:var(--pe)}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.op:hover .im img{transform:scale(1.05)}.im.big{margin:-28px -28px 8px;height:200px}
@media(max-width:860px){#nv{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#fff;padding:12px;border-bottom:1px solid #eadfd3}#nv.open{display:flex}.bg{display:block}.hero,.pg,.g2{grid-template-columns:1fr}.hw{grid-template-columns:1fr 1fr}.nb>a img{height:38px}.ra .btn{padding:7px 12px}}
@media(max-width:480px){.hw{grid-template-columns:1fr}.st small{font-size:10px}.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chip{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.hv img{width:100%;height:100%;object-fit:cover;display:block}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.dt{position:relative;border:0;border-radius:18px;overflow:hidden;height:150px;cursor:pointer;color:#fff;text-align:left;padding:0;background:var(--nv);font:inherit}
.dt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.dt:hover img{transform:scale(1.07)}
.dt:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#172033e6)}
.dt span{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font:600 15px Poppins;line-height:1.25}
.dt small{display:block;font:400 12px Inter;opacity:.92}
</style></head><body>

const REV=[['Aarav Menon','B.Tech CSE, VIT Vellore','TechNova Labs',5,'My internship gave me real React tickets from week one. My mentor reviewed every pull request.'],['Sneha Iyer','BCA, Christ University','DataBridge Analytics',5,'I built SQL dashboards on live data. The remote setup was smooth and the team was supportive.'],['Rahul Verma','B.Des, NID Ahmedabad','PixelCraft Studio',4,'Great exposure to user research and Figma critiques. Deadlines were tight but fair.'],['Priya Nair','BBA, Mount Carmel College','GrowthSpark',4,'I ran two campaigns on my own. It was unpaid, but the portfolio work helped me land a paid role.'],['Karthik S','B.E. ISE, RVCE','CloudNest',5,'The hiring process was clear and quick, and I always knew my application status.'],['Meera Joshi','MBA, SP Jain','FinEdge',4,'Good mentoring and a real analyst workload. The application tracker kept me organised.']];

const rc=r=>`<article class="card rv">${stars(r[3])}<p style="margin-top:8px">“${r[4]}”</p><div class="ct" style="margin-top:12px"><span class="lg">${r[0][0]}</span><div><b>${r[0]}</b><p class="mt" style="margin:0">${r[1]} · ${r[2]}</p></div></div></article>`;
const rv=c=>{const l=REV.filter(r=>r[2]==c);return l.length?'<h3>Student reviews</h3>'+l.map(r=>`<p>${stars(r[3])} “${r[4]}”<br><span class="mt">${r[0]}, ${r[1]}</span></p>`).join(''):''};
function wr(){openM(`<h2>Write a review</h2><form onsubmit="postRv(event)"><label>Your name<input name="n" required value="${P.name}"></label><label>College and course<input name="k" required></label><label>Company<select name="c">${CN.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Rating<select name="r"><option value="5">5 – Excellent</option><option value="4">4 – Good</option><option value="3">3 – Okay</option><option value="2">2 – Poor</option><option value="1">1 – Very poor</option></select></label><label>Your review<textarea name="t" rows="3" required></textarea></label><button class="btn">Post review</button></form>`)}
function postRv(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));REV.unshift([f.n,f.k,f.c,+f.r,f.t]);closeM();show('home');toast('Thanks! Your review is posted');setTimeout(()=>$('#rev').scrollIntoView(),80)}

function card(o){return `<article class="card op" tabindex="0" onclick="det('${o.id}')" onkeydown="if(event.key=='Enter')det('${o.id}')">${img(o)}<div class="ct"><span class="lg">${o.c[0]}</span><div><h3>${o.t}</h3><p class="mt" style="margin:0">${o.c}</p></div></div><p class="mt">${o.loc} · ${o.mode} · ${o.type=='Job'?o.exp:o.dur}</p><div class="tg">${o.sk.map(s=>`<span>${s}</span>`).join('')}</div><p class="mt">${o.pay} · ${o.type=='Job'?'Posted '+o.posted:'Apply by '+o.dl}</p><div class="ac"><button class="sv ${saved.has(o.id)?'on':''}" data-id="${o.id}" aria-pressed="${saved.has(o.id)}" onclick="sv(event,'${o.id}')">${saved.has(o.id)?'♥ Saved':'♡ Save'}</button><button class="btn s" onclick="ap(event,'${o.id}')">Apply →</button></div></article>`}
function sv(e,id){e&&e.stopPropagation();saved.has(id)?saved.delete(id):saved.add(id);const on=saved.has(id);$$(`.sv[data-id="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.textContent=on?'♥ Saved':'♡ Save'});toast(on?'Saved to your profile':'Removed from saved');if(cur=='profile')rr()}
function bar(k){return `<div class="card fb"><label class="sr" for="q-${k}">Search</label><input id="q-${k}" type="search" placeholder="Search jobs, internships, skills..." oninput="run('${k}')"><div class="sel">${KS[k].map(f=>`<label>${SEL[f][0]}<select id="${f}-${k}" onchange="run('${k}')"><option value="">All</option>${SEL[f][1].map(v=>`<option>${v}</option>`).join('')}</select></label>`).join('')}</div><div class="chips" role="group" aria-label="Quick filters">${CH.map((c,i)=>`<button type="button" class="chip" aria-pressed="false" onclick="chip(this,'${k}',${i})">${c[0]}</button>`).join('')}<button type="button" class="chip" onclick="clr('${k}')">Clear Filters</button></div></div><p id="cnt-${k}" class="mt" role="status"></p><div id="res-${k}" class="grid"></div>`}
function run(k){const q=$('#q-'+k).value.toLowerCase().trim(),vs=KS[k].map(f=>$(`#${f}-${k}`).value),act=q||vs.some(x=>x)||ch[k].size;let r=O.filter(o=>(k=='home'||o.type==k)&&(!q||[o.t,o.c,o.loc,o.type,o.ind,...o.sk].join(' ').toLowerCase().includes(q))&&KS[k].every((f,i)=>{const x=SEL[f][2](o);return !vs[i]||(Array.isArray(x)?x.includes(vs[i]):x==vs[i])})&&[...ch[k]].every(i=>CH[i][1](o)));
$('#res-'+k).innerHTML=(k=='home'&&!act)?'':r.map(card).join('')||'<div class="card">No matches yet. Try removing a filter or searching a different skill.</div>';$('#cnt-'+k).textContent=(k=='home'&&!act)?'':r.length+' opportunit'+(r.length==1?'y':'ies')+' found'}
function chip(b,k,i){ch[k].has(i)?ch[k].delete(i):ch[k].add(i);b.classList.toggle('on');b.setAttribute('aria-pressed',ch[k].has(i));run(k)}
function clr(k){$('#q-'+k).value='';KS[k].forEach(f=>$(`#${f}-${k}`).value='');ch[k].clear();$$('#app .chip.on').forEach(b=>{if(b.getAttribute('aria-pressed'))b.classList.remove('on')});$$('#app .chip[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',false));run(k)}
function skl(s){show('home');$('#q-home').value=s;run('home');$$('.skc').forEach(b=>b.classList.toggle('on',b.textContent==s));$('#search').scrollIntoView()}

<section class="wrap"><h2>How Internova Works</h2><div class="hw">${HW.map((h,i)=>`<div class="card rv" style="transition-delay:${i*.3}s"><b>${i+1}</b><h3>${h[0]}</h3><p class="mt">${h[1]}</p></div>`).join('')}</div></section>
<section class="wrap rv"><div class="g2"><div class="card"><h2>Your profile, ready to apply</h2><div class="av">${P.name[0]}</div><b>${P.name}</b><p class="mt">${P.headline}</p><div class="pb"><i style="width:${pct()}%"></i></div><p class="mt">${pct()}% complete</p><button class="btn s" onclick="show('profile')">Build your profile</button></div><div class="card"><h2>Resume</h2><p class="mt">Upload once. Your resume is attached automatically when you apply.</p><div class="row" style="margin-top:14px"><button class="btn" onclick="$('#rf').click()">Upload Resume</button><button class="btn o" onclick="show('profile')">Manage resume</button></div></div></div></section>
${sec('Companies hiring students',`<div class="grid">${CN.map((n,i)=>`<button class="card op" style="text-align:left;font:inherit" onclick="cmp(${i})"><span class="lg">${n[0]}</span><h3 style="margin-top:8px">${n}</h3><p class="mt">${CO[n][0]} · ${CO[n][1]}</p></button>`).join('')}</div>`)}
<span id="rev"></span>${sec('What students say',`<div class="grid">${REV.map(rc).join('')}</div><p style="margin-top:14px"><button class="btn s o" onclick="wr()">Write a review</button></p>`)}${sec('Track every application',`<div class="card"><h3>Software Development Intern · TechNova Labs</h3>${tlh(2)}<button class="btn s b" onclick="show('applications')">Open My Applications</button></div>`)}
<section class="wrap rv"><div class="cta"><h2>Discover Opportunities. Start Your Journey.</h2><p>Create your free profile and apply in minutes.</p><button class="btn" onclick="show('signup')">Get Started →</button></div></section>`,
Internship:()=>`<section class="wrap"><h1>Find Your Next Internship</h1><p class="lead">Short, skill-building roles for students.</p>${bar('Internship')}</section>`,
Job:()=>`<section class="wrap"><h1>Find Your Next Opportunity</h1><p class="lead">Entry-level jobs for fresh graduates.</p>${bar('Job')}</section>`,
applications:()=>`<section class="wrap"><h1>My Applications</h1><div id="tabs" class="chips" role="tablist" style="margin:16px 0"></div><div id="al" class="stack"></div></section>`,
profile:()=>`<section class="wrap"><span class="kick">STUDENT PROFILE</span><h1>Build a Profile That Gets Noticed.</h1><div class="pg"><div class="card"><div class="av">${P.name[0]}</div><h2>${P.name}</h2><p>${P.headline}</p><p class="mt">${P.email}<br>${P.phone}</p><div class="pb"><i id="pbi" style="width:0"></i></div><b>${pct()}% Profile Complete</b><div class="row" style="margin-top:14px"><button class="btn s" onclick="editP()">Edit Profile</button></div></div><div class="stack">
<div class="card"><h3>Education</h3><p>${P.edu||'Add your education'}</p></div>
<div class="card"><h3>Skills</h3><div class="tg">${P.skills.map(s=>`<span>${s}</span>`).join('')}</div><form class="row" onsubmit="addSk(event)"><label class="sr" for="ns">New skill</label><input id="ns" placeholder="Add a skill" style="max-width:240px"><button class="btn s">Add Skill</button></form></div>
<div class="card"><h3>Projects</h3>${P.projects.map(p=>`<p><b>${p.t}</b><br><span class="mt">${p.d}</span></p>`).join('')}<button class="btn s o" style="margin-top:10px" onclick="addPr()">Add Project</button></div>
<div class="card"><h3>Certifications &amp; Experience</h3><p>${P.certs||'—'}</p><p>${P.exp||'—'}</p></div><div class="card"><h3>Career Preferences</h3><p>${P.pref||'—'}</p></div>
<div class="card"><h3>Resume</h3><p class="mt">${P.resume?'✓ '+P.resume.name:'No resume uploaded yet. It will be attached when you apply.'}</p><div class="row" style="margin-top:10px">${P.resume?`<a class="btn s o" href="${P.resume.url}" target="_blank" rel="noopener">View Resume</a><button class="btn s" onclick="$('#rf').click()">Replace Resume</button><a class="btn s o" href="${P.resume.url}" download="${P.resume.name}">Download Resume</a>`:`<button class="btn s" onclick="$('#rf').click()">Upload Resume</button>`}</div></div>
<div class="card"><h3>Saved Opportunities</h3><div class="stack" style="margin-top:10px">${[...saved].map(id=>get(id)).map(o=>`<div class="ac" style="margin:0"><button class="ib" onclick="det('${o.id}')">${o.t} · ${o.c}</button><button class="sv on" data-id="${o.id}" onclick="sv(event,'${o.id}')">♥ Saved</button></div>`).join('')||'<p class="mt">Nothing saved yet. Tap ♡ Save on any opportunity.</p>'}</div></div></div></div></section>`,
login:()=>`<div class="card auth"><h1 style="font-size:1.8rem">Welcome back</h1><form onsubmit="return au(event,0)"><label>Email<input type="email" required></label><label>Password<input type="password" required minlength="6"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;min-height:0"> Remember me</label><button class="btn b">Sign In</button><button type="button" class="ib" onclick="show('forgot')">Forgot Password?</button></form><p class="mt">New here? <a href="#" onclick="show('signup');return false">Create an account</a></p></div>`,
signup:()=>`<div class="card auth"><h1 style="font-size:1.8rem">Create your account</h1><form onsubmit="return au(event,1)"><label>Full Name<input name="n" required></label><label>Email<input name="e" type="email" required></label><label>Password<input name="p" type="password" required minlength="6"></label><label>Confirm Password<input name="c" type="password" required></label><fieldset style="border:0"><legend>Account type</legend><label style="display:flex;gap:8px;align-items:center"><input type="radio" name="t" value="s" checked style="width:auto;min-height:0"> Student</label><label style="display:flex;gap:8px;align-items:center"><input type="radio" name="t" value="r" style="width:auto;min-height:0"> Employer / Recruiter</label></fieldset><button class="btn">Create Account</button></form></div>`,
forgot:()=>`<div class="card auth"><h1 style="font-size:1.8rem">Reset password</h1><form onsubmit="event.preventDefault();toast('Reset link sent. Check your inbox.');show('login')"><label>Email<input type="email" required></label><button class="btn b">Send reset link</button></form></div>`};
function au(e,s){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(s){if(f.p!=f.c)return toast('Passwords do not match'),false;P.name=f.n;P.email=f.e;U=1;navR();if(f.t=='s'){show('profile');toast('Account created. Complete your profile.');editP()}else{show('home');toast('Employer account created. Recruiter tools are not in this prototype.')}}else{U=1;navR();show('home');toast('Welcome back, '+P.name.split(' ')[0])}return false}
function navR(){$('#au').innerHTML=U?'<button class="ib" onclick="U=0;navR();show(\'home\')">Sign out</button>':'<button class="ib" onclick="show(\'login\')">Login</button><button class="btn s" onclick="show(\'signup\')">Get Started</button>'}
function show(v){cur=v;$('#app').innerHTML=V[v]();$$('#nv a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));$('#nv').classList.remove('open');scrollTo(0,0);if(KS[v])run(v);if(v=='applications')tr();if(v=='profile')anim();obs()}
const rr=()=>{const y=scrollY;$('#app').innerHTML=V.profile();anim();scrollTo(0,y)},anim=()=>setTimeout(()=>{const b=$('#pbi');b&&(b.style.width=pct()+'%')},80);
function obs(){const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add('in'),io.unobserve(e.target))),{threshold:.12});$$('.rv:not(.in)').forEach(x=>io.observe(x))}
const sn=()=>{show('home');setTimeout(()=>{$('#search').scrollIntoView();$('#q-home').focus()},60)};
function tr(){$('#tabs').innerHTML=['All',...ST].map((n,i)=>`<button role="tab" aria-selected="${tab==i-1}" class="chip ${tab==i-1?'on':''}" onclick="tab=${i-1};tr()">${n} (${i?A.filter(a=>a.st==i-1).length:A.length})</button>`).join('');const L=A.filter(a=>tab<0||a.st==tab);$('#al').innerHTML=L.map(a=>{const o=get(a.oid);return `<article class="card op" tabindex="0" onclick="ad('${a.id}')" onkeydown="if(event.key=='Enter')ad('${a.id}')"><div class="ac" style="margin:0"><div><h3>${o.t}</h3><p class="mt" style="margin:0">${o.c} · Applied ${a.date}</p></div>${badge(a.st)}</div><p class="mt"><b>Next step:</b> ${NX[a.st]}</p>${tlh(a.st)}</article>`}).join('')||`<div class="card"><h3>${A.length?'Nothing in this stage yet':'No applications yet'}</h3><p class="mt">Find a role that fits and apply in minutes.</p><div class="row" style="margin-top:12px"><button class="btn s" onclick="show('Internship')">Browse internships</button><button class="btn s o" onclick="show('Job')">Browse jobs</button></div></div>`}
function ad(id){const a=A.find(x=>x.id==id),o=get(a.oid);openM(`<h2>${o.t}</h2><p>${o.c} · ${o.loc}</p><p class="mt">Application ID <b>${a.id}</b> · Applied ${a.date}</p><div>${badge(a.st)}</div>${tlh(a.st)}<p><b>Next step:</b> ${NX[a.st]}</p><label>Update status (demo)<select onchange="us('${a.id}',this.value)">${ST.map((s,i)=>`<option value="${i}" ${i==a.st?'selected':''}>${s}</option>`).join('')}</select></label>`)}
function us(id,v){A.find(x=>x.id==id).st=+v;ad(id);if(cur=='applications')tr()}
function det(id){const o=get(id),i=o.type=='Job';openM(`${img(o,1)}<h2>${o.t}</h2><p><a href="#" onclick="cmp(${CN.indexOf(o.c)});return false">${o.c}</a> · ${o.loc} · ${o.mode}</p><p class="mt">${i?o.exp+' · '+o.pay:o.dur+' · '+o.pay} · Deadline ${o.dl}</p><div class="tg">${o.sk.map(s=>`<span>${s}</span>`).join('')}</div><h3>Description</h3><p>Join ${o.c} as a ${o.t} and work on real projects with experienced mentors. You will learn by doing and build work that strengthens your ${i?'career':'first step into industry'}.</p><h3>Responsibilities</h3><ul><li>Support the team on day-to-day deliverables</li><li>Apply ${o.sk[0]} and ${o.sk[1]||o.sk[0]} on live projects</li><li>Share progress in weekly reviews</li></ul><h3>Requirements</h3><ul><li>Pursuing or holding a relevant degree</li><li>Working knowledge of ${o.sk.join(', ')}</li><li>Clear communication and curiosity</li></ul><h3>Benefits</h3><ul><li>Mentorship and learning budget</li><li>${i?'Health cover and paid leave':'Certificate and pre-placement offer chance'}</li><li>Flexible ${o.mode.toLowerCase()} setup</li></ul>${rv(o.c)}<div class="row"><button class="btn" onclick="ap(null,'${o.id}')">Apply Now →</button><button class="sv ${saved.has(id)?'on':''}" data-id="${id}" onclick="sv(event,'${id}')">${saved.has(id)?'♥ Saved':'♡ Save'}</button></div>`)}
function cmp(i){const n=CN[i];openM(`<h2>${n}</h2><p class="mt">${CO[n][0]} · ${CO[n][1]}</p><p>${CO[n][2]}</p><h3>Open roles</h3>${O.filter(o=>o.c==n).map(o=>`<button class="btn s o" onclick="det('${o.id}')">${o.t}</button>`).join('')}`)}
function ap(e,id){e&&e.stopPropagation();const o=get(id);if(A.some(a=>a.oid==id))return toast('You already applied to this role'),show('applications');openM(`<h2>Apply to ${o.t}</h2><p class="mt">${o.c} · ${o.loc}</p><form onsubmit="sub(event,'${id}')"><label>Full Name<input name="n" required value="${P.name}"></label><label>Email<input name="e" type="email" required value="${P.email}"></label><label>Phone<input name="p" type="tel" required value="${P.phone}"></label><label>Resume ${P.resume?`<span class="mt">✓ Using ${P.resume.name} from your profile</span>`:''}<input type="file" name="f" accept=".pdf,.doc,.docx" ${P.resume?'':'required'}></label><label>Skills<input name="s" value="${P.skills.join(', ')}"></label><label>Cover Letter<textarea name="c" rows="3" placeholder="Why are you a good fit?"></textarea></label><label>Availability<select name="a"><option>Immediately</option><option>Within 2 weeks</option><option>Within a month</option></select></label><div class="row"><button type="button" class="btn o" onclick="closeM()">Cancel</button><button class="btn">Submit Application</button></div></form>`)}
function sub(e,id){e.preventDefault();const o=get(id),f=e.target.f.files[0],a={id:'INV-'+(1000+Math.floor(Math.random()*9000)),oid:id,date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),st:0};if(f&&!P.resume)a.res=f.name;A.unshift(a);openM(`<div class="okc">✓</div><h2>Application Submitted Successfully!</h2><dl><dt>Application ID</dt><dd>${a.id}</dd><dt>Role</dt><dd>${o.t}</dd><dt>Company</dt><dd>${o.c}</dd><dt>Applied Date</dt><dd>${a.date}</dd><dt>Status</dt><dd>${badge(0)}</dd></dl><div class="row"><button class="btn" onclick="ad('${a.id}')">View Application</button><button class="btn b" onclick="closeM();show('applications')">Go to Applications</button></div>`)}
function editP(){openM(`<h2>Edit Profile</h2><form onsubmit="svP(event)">${[['name','Full Name'],['email','Email'],['phone','Phone'],['headline','Headline'],['edu','Education'],['exp','Experience'],['certs','Certifications'],['pref','Career Preferences']].map(f=>`<label>${f[1]}<input name="${f[0]}" value="${P[f[0]]||''}"></label>`).join('')}<div class="row"><button type="button" class="btn o" onclick="closeM()">Cancel</button><button class="btn">Save changes</button></div></form>`)}
function svP(e){e.preventDefault();Object.assign(P,Object.fromEntries(new FormData(e.target)));closeM();toast('Profile updated');cur=='profile'?rr():show('profile')}
function addSk(e){e.preventDefault();const v=$('#ns').value.trim();if(v&&!P.skills.includes(v)){P.skills.push(v);toast('Skill added')}rr()}
function addPr(){openM(`<h2>Add Project</h2><form onsubmit="event.preventDefault();P.projects.push({t:this.t.value,d:this.d.value});closeM();toast('Project added');rr()"><label>Project title<input name="t" required></label><label>Description<textarea name="d" rows="3" required></textarea></label><button class="btn">Add Project</button></form>`)}
function up(i){const f=i.files[0];if(!f)return;P.resume={name:f.name,url:URL.createObjectURL(f)};toast('Resume uploaded');i.value='';if(cur=='profile')rr()}
function openM(h){$('#mb').innerHTML=h;$('#mod').classList.add('on');setTimeout(()=>{const f=$('#mb input,#mb button');f&&f.focus()},50)}
const closeM=()=>$('#mod').classList.remove('on');let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
addEventListener('keydown',e=>e.key=='Escape'&&closeM());$('#mod').addEventListener('click',e=>e.target.id=='mod'&&closeM());
$('#nv').innerHTML=[['home','Home'],['Internship','Internships'],['Job','Jobs'],['profile','Profile'],['applications','Applications']].map(n=>`<a href="#" data-v="${n[0]}" onclick="show('${n[0]}');return false">${n[1]}</a>`).join('');navR();show('home');
</script></body></html>
